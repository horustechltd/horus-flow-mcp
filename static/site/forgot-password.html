<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Horus Flow Intelligence</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/brand.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🦅</text></svg>">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-xl); }
        .auth-card { width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-2xl) var(--space-xl); backdrop-filter: blur(16px); }
        .auth-card h1 { font-size: 1.8rem; margin-bottom: var(--space-xs); text-align: center; }
        .auth-card .subtitle { color: var(--text-secondary); margin-bottom: var(--space-xl); font-size: 0.9rem; text-align: center; line-height: 1.6; }
        .form-group { margin-bottom: var(--space-md); }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { width: 100%; padding: 13px 16px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); color: var(--text-primary); font-family: var(--font-main); font-size: 0.95rem; outline: none; transition: border-color var(--transition-fast); box-sizing: border-box; }
        .form-input:focus { border-color: var(--gold-primary); box-shadow: 0 0 0 3px var(--gold-glow); }
        .form-input::placeholder { color: var(--text-muted); }
        .auth-error { background: rgba(255, 82, 82, 0.1); border: 1px solid rgba(255, 82, 82, 0.3); color: var(--accent-red); padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: var(--space-md); display: none; }
        .auth-success { background: rgba(0, 230, 118, 0.1); border: 1px solid rgba(0, 230, 118, 0.3); color: var(--accent-green); padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: var(--space-md); display: none; }
        .auth-footer { margin-top: var(--space-lg); text-align: center; font-size: 0.85rem; color: var(--text-muted); }
        .auth-footer a { color: var(--gold-primary); font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.8rem; text-decoration: none; margin-bottom: var(--space-lg); transition: color var(--transition-fast); }
        .back-link:hover { color: var(--text-primary); }
        .logo-header { display: flex; align-items: center; gap: 10px; margin-bottom: var(--space-xl); justify-content: center; }
        .logo-header .logo-icon { width: 38px; height: 38px; background: var(--gold-gradient); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .logo-header span { font-family: var(--font-mono); font-weight: 900; font-size: 1rem; letter-spacing: 1px; }
        .reset-link-box { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px 16px; font-family: var(--font-mono); font-size: 0.75rem; word-break: break-all; color: var(--gold-primary); margin-top: var(--space-md); display: none; cursor: pointer; position: relative; }
        .reset-link-box:hover { border-color: var(--gold-primary); }
        .reset-link-box .copy-hint { position: absolute; top: -8px; right: 10px; background: var(--bg-card); padding: 0 6px; font-size: 0.65rem; color: var(--text-muted); }
        .lock-icon { font-size: 2.5rem; text-align: center; margin-bottom: var(--space-md); }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="./login.html" class="back-link">← Back to Sign In</a>

            <div class="logo-header">
                <div class="logo-icon">🦅</div>
                <span>HORUS <span style="font-weight:400; color: var(--text-muted);">FLOW</span></span>
            </div>

            <div class="lock-icon">🔒</div>
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email address and we'll generate a password reset link.</p>

            <div class="auth-error" id="auth-error"></div>
            <div class="auth-success" id="auth-success"></div>

            <form id="forgot-form" onsubmit="return handleForgot(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@company.com" required autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="submit-btn">Send Reset Link</button>
            </form>

            <div class="reset-link-box" id="reset-link-box" onclick="copyLink()">
                <span class="copy-hint">Click to copy</span>
                <span id="reset-link-text"></span>
            </div>

            <div class="auth-footer">
                Remember your password? <a href="./login.html">Sign In →</a>
            </div>
        </div>
    </div>

    <script>
        async function handleForgot(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errDiv = document.getElementById('auth-error');
            const successDiv = document.getElementById('auth-success');
            const linkBox = document.getElementById('reset-link-box');
            errDiv.style.display = 'none';
            successDiv.style.display = 'none';
            linkBox.style.display = 'none';
            btn.textContent = 'Generating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    successDiv.textContent = '✅ ' + data.message;
                    successDiv.style.display = 'block';
                    if (data.reset_url) {
                        document.getElementById('reset-link-text').textContent = data.reset_url;
                        linkBox.style.display = 'block';
                    }
                } else {
                    errDiv.textContent = data.detail || 'An error occurred.';
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.textContent = 'Connection error. Please try again.';
                errDiv.style.display = 'block';
            }
            btn.textContent = 'Send Reset Link';
            btn.disabled = false;
        }

        function copyLink() {
            const text = document.getElementById('reset-link-text').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const hint = document.querySelector('.copy-hint');
                hint.textContent = 'Copied!';
                setTimeout(() => hint.textContent = 'Click to copy', 2000);
            });
        }
    </script>
</body>
</html>
