[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horus-flow-mcp"
version = "3.0.0"
description = "Cognitive Market Brain for Autonomous AI Trading Agents (Orderflow Physics, Liquidation Gravity & Contradiction Engine)"
readme = "README.md"
authors = [
  { name = "Horus Tech Ltd", email = "admin@horustek.pro" }
]
keywords = [
  "mcp", "orderflow", "trading", "crypto", "equities",
  "whale-detection", "spoofing", "liquidation", "smart-money",
  "block-trades", "dark-pool", "ai-agents", "bitcoin", "ethereum"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.27.0",
  "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/horustechltd/horus-flow-mcp"
Repository = "https://github.com/horustechltd/horus-flow-mcp"
Documentation = "https://glama.ai/mcp/servers/horustechltd/horus-flow-mcp"

[project.scripts]
horus-flow-mcp = "horus_mcp_public:main"

[tool.hatch.build.targets.wheel]
packages = ["horus_mcp_public.py"]
