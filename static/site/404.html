<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Horus Flow Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/brand.css">
    <style>
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-xl); }
        .error-page h1 { font-family: var(--font-mono); font-size: 6rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: var(--space-sm); line-height: 1; }
        .error-page h2 { font-size: 1.3rem; margin-bottom: var(--space-md); color: var(--text-primary); }
        .error-page p { color: var(--text-secondary); margin-bottom: var(--space-xl); font-size: 0.95rem; }
        .error-actions { display: flex; gap: var(--space-md); justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <h1>404</h1>
            <h2>Signal Not Found</h2>
            <p>The page you're looking for doesn't exist or has been moved.<br>Even our whale detection can't find it.</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Back to Home</a>
                <a href="/login.html" class="btn btn-secondary">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
