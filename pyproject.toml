[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horus-flow-mcp"
version = "1.0.1"
description = "Institutional-grade crypto & equity orderflow intelligence for AI agents"
readme = "README.md"
authors = [
  { name = "Horus Tech Ltd", email = "admin@horustek.pro" }
]
keywords = [
  "mcp", "orderflow", "trading", "crypto", 
  "institutional", "binance", "alpaca", "ai-agents"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/horustechltd/horus-flow-mcp"
Repository = "https://github.com/horustechltd/horus-flow-mcp"
Documentation = "https://glama.ai/mcp/servers/horustechltd/horus-flow-mcp"

[project.scripts]
horus-flow-mcp = "horus_mcp_public:main"

[tool.hatch.build.targets.wheel]
packages = ["horus_mcp_public.py"]
